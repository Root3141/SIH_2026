 [build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "skyguard"
version = "0.1.0"
description = "Hybrid anomaly detection system for automated weather station networks"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "requests>=2.31",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "lime>=0.2",
]


[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pytest>=7.0",
    "ruff>=0.1",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py310"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]